[profile.default]
src = "contracts"
test = "test/foundry"
out = "contracts/forge-out"
libs = ["node_modules"]
remappings = ["@openzeppelin/=node_modules/@openzeppelin/", "forge-std/=lib/forge-std/src/"]
solc = "bin/solc"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fuzz = { runs = 512, max_test_rejects = 200000 }
invariant = { runs = 64, depth = 40, fail_on_revert = false }
