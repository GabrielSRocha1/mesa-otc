<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="verum-otc-api" content="">
<title>VERUM OTC — Confirmar carteira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080d1a; --bg-2:#0a1122; --panel:#0f1a30; --line:#1c2b48; --line-2:#223350;
  --ink:#e8eefc; --ink-2:#aebbd4; --ink-3:#7788a6;
  --green:#22c55e; --green-soft:rgba(34,197,94,.14); --blue:#4f9bff; --blue-soft:rgba(79,155,255,.14);
  --amber:#eab308; --amber-soft:rgba(234,179,8,.14); --red:#ef4444;
  --purple:#a855f7; --purple-soft:rgba(168,85,247,.14);
  --f-head:"Sora",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(1000px 500px at 80% -10%,rgba(79,155,255,.07),transparent 60%),radial-gradient(800px 400px at 0% 110%,rgba(34,197,94,.05),transparent 55%),var(--bg);
  color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:grid;place-items:center;padding:24px;
}
h1,h2,h3{font-family:var(--f-head);margin:0;letter-spacing:-.01em}
.card{width:100%;max-width:460px;background:linear-gradient(180deg,var(--panel),var(--bg-2));border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:24px}
.brand .mark{width:38px;height:38px;border-radius:10px;background:var(--blue-soft);border:1px solid var(--line-2);display:grid;place-items:center}
.brand svg{width:22px;height:22px}
.brand .name{font-family:var(--f-head);font-weight:800;font-size:16px}
.brand .tag{font-size:11px;color:var(--ink-3)}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--purple);background:var(--purple-soft);border:1px solid var(--purple);padding:5px 11px;border-radius:999px;margin-bottom:14px}
.eyebrow svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
h1{font-size:22px;margin-bottom:8px}
.sub{color:var(--ink-2);font-size:13.5px;margin-bottom:22px}
.sub b{color:var(--ink)}
.role-box{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);margin-bottom:20px}
.role-box .ri{width:40px;height:40px;flex:none;border-radius:10px;display:grid;place-items:center}
.role-box .ri svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
.r-sell{background:#3b82f6}.r-buy{background:#22c55e}.r-pm2{background:#a855f7}
.role-box .rl{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.role-box .rn{font-family:var(--f-head);font-weight:700;font-size:16px}
.role-box .rnet{font-size:12px;color:var(--ink-3);margin-top:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;height:50px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--blue);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.btn-primary{background:linear-gradient(135deg,#22c55e,#16a34a);border:none;color:#04240f;box-shadow:0 10px 26px rgba(34,197,94,.28)}
.btn-primary:hover{filter:brightness(1.06);color:#04240f}
.alt{text-align:center;margin-top:14px;font-size:13px;color:var(--ink-3)}
.alt a{color:var(--blue);cursor:pointer;text-decoration:none}.alt a:hover{text-decoration:underline}
.note{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--ink-3);margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.note svg{width:15px;height:15px;flex:none;stroke:var(--green);fill:none;stroke-width:2;margin-top:1px}
.state{text-align:center;padding:8px 0}
.state .ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px}
.state .ic svg{width:32px;height:32px;fill:none;stroke-width:2.4}
.ic.ok{background:var(--green-soft)}.ic.ok svg{stroke:var(--green)}
.ic.err{background:rgba(239,68,68,.14)}.ic.err svg{stroke:var(--red)}
.ic.wait{background:var(--amber-soft)}.ic.wait svg{stroke:var(--amber)}
.mono{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);word-break:break-all}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none}
.toast-wrap{position:fixed;top:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{padding:11px 16px;border-radius:11px;border:1px solid var(--line-2);background:#0d1730;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.4);max-width:88vw}
.toast.err{border-color:var(--red);color:#fecaca}.toast.ok{border-color:var(--green);color:#bbf7d0}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 512 512" fill="none"><defs><linearGradient id="vmark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f9bff"/><stop offset="1" stop-color="#22c55e"/></linearGradient></defs><path d="M140 150 L256 372 L372 150" stroke="url(#vmark)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/><circle cx="256" cy="150" r="26" fill="#22c55e"/></svg></div>
    <div><div class="name">VERUM OTC</div><div class="tag">Confirmação de carteira</div></div>
  </div>
  <div id="body"><div class="state"><div class="spin" style="margin:20px auto"></div><p class="sub" style="text-align:center;margin:14px 0 0">Carregando convite…</p></div></div>
</div>
<div class="toast-wrap" id="toasts"></div>

<script>
(function(){
  "use strict";
  const BUILD = 'b7-assina-2026-01-09'; // selo de versão VISÍVEL — confirma qual HTML carregou (cache)
  try{ console.log('VERUM OTC convite build', BUILD); }catch(e){}
  const $ = s => document.querySelector(s);
  const META = document.querySelector('meta[name="verum-otc-api"]');
  const API = ((META && META.content) || '/').replace(/\/$/,'');
  const ROLE = { SELLER:{label:'Vendedor',cls:'r-sell',ico:'<circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0116 0"/>'},
                 BUYER:{label:'Comprador',cls:'r-buy',ico:'<path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-6h6v6"/>'},
                 PAYMASTER_2:{label:'Pay Master 2',cls:'r-pm2',ico:'<circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0111 0M17 7a2.5 2.5 0 010 5"/>'} };
  const NETLABEL = { multichain:'Multichain (Verum)', ethereum:'Ethereum', solana:'Solana', bitcoin:'Bitcoin', bsc:'BNB Smart Chain', polygon:'Polygon', tron:'Tron', arbitrum:'Arbitrum One', base:'Base', avalanche:'Avalanche C-Chain', cronos:'Cronos EVM', optimism:'Optimism', xrp:'XRP Ledger', zcash:'Zcash', ton:'TON', aptos:'Aptos', near:'NEAR', algorand:'Algorand', stellar:'Stellar' };
  // Assinatura só funciona p/ solana/ethereum/bitcoin no backend. Verum é Solana
  // por baixo e o getAddresses traz todas as redes — então mapeamos a rede
  // escolhida para uma auth suportada (EVM→ethereum, bitcoin→bitcoin, resto→solana).
  const EVM_KEYS=['ethereum','bsc','polygon','arbitrum','base','avalanche','cronos','optimism'];
  function authNetFor(net){ if(net==='bitcoin') return 'bitcoin'; if(EVM_KEYS.indexOf(net)>=0) return 'ethereum'; return 'solana'; }

  function toast(msg,type){ const el=document.createElement('div'); el.className='toast '+(type||''); el.textContent=msg; $('#toasts').appendChild(el); setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},3200); }

  async function api(path,opts){
    opts=opts||{}; const headers={'accept':'application/json'};
    if(opts.body!==undefined) headers['content-type']='application/json';
    if(opts.token) headers['authorization']='Bearer '+opts.token;
    const res=await fetch(API+path,{method:opts.method||'GET',headers,body:opts.body!==undefined?JSON.stringify(opts.body):undefined});
    let data=null; try{ data=await res.json(); }catch(e){}
    if(!res.ok){
      let m=(data&&(data.message||data.error))||('Erro '+res.status);
      // Validação zod devolve details.issues — nomeia os campos no toast (diagnóstico de 1 rodada).
      try{ const iss=data&&data.details&&data.details.issues; if(Array.isArray(iss)&&iss.length){ m+=' ['+iss.slice(0,3).map(i=>((i.path||[]).join('.')||'corpo')+': '+(i.message||i.code)).join(' · ')+']'; } }catch(e2){}
      const e=new Error(m); e.status=res.status; e.details=data&&data.details; throw e;
    }
    return data;
  }

  // token do convite a partir do caminho /convite/<token> (ou /invite/<token>)
  function inviteToken(){
    const m = location.pathname.match(/\/(?:convite|invite)\/([^/?#]+)/);
    if(m) return decodeURIComponent(m[1]);
    return new URLSearchParams(location.search).get('token') || '';
  }
  const shortAddr = a => a && a.length>12 ? a.slice(0,6)+'…'+a.slice(-4) : a;
  function hexAddr(){ let h='0x'; const c='0123456789abcdef'; for(let i=0;i<40;i++) h+=c[Math.floor(Math.random()*16)]; return h; }

  // ── Mobile sem extensão: abrir ESTE convite dentro do navegador dApp da Verum ──
  // No celular não existe extensão/window.verum; igual ao portal, redirecionamos para o
  // navegador dApp da Verum já carregando o PRÓPRIO link do convite (token preservado no
  // caminho/query) — lá dentro window.verum existe e a conexão/assinatura funciona.
  const IS_MOBILE=/android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent||'');
  // ESTRITO à Verum: outras carteiras injetadas (Solflare/MetaMask) não contam — sem a Verum, dapp-browser.
  function hasInjectedWallet(){ const w=window; return !!(w.verum||(w.solana&&w.solana.isVerum)||(w.ethereum&&(w.ethereum.isVerum||(Array.isArray(w.ethereum.providers)&&w.ethereum.providers.some(p=>p&&p.isVerum))))); }
  const VERUM_DAPP_BROWSER='https://www.verumcrypto.com/dapp-browser';
  function openInVerumBrowser(){
    const url=VERUM_DAPP_BROWSER+'?url='+encodeURIComponent(location.origin+location.pathname+location.search)+'&name='+encodeURIComponent('VERUM OTC');
    window.location.href=url; // leva o usuário à Verum com o convite aberto no navegador dela
  }

  /* ---------- carteira injetada (EVM / Phantom / Unisat) ---------- */
  const B58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
  function bs58encode(bytes){ const b=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes); let n=0n; for(const x of b) n=n*256n+BigInt(x); let out=''; while(n>0n){ out=B58[Number(n%58n)]+out; n/=58n; } for(const x of b){ if(x!==0) break; out='1'+out; } return out; }
  function bs58decode(s){ let n=0n; for(const c of s){ const i=B58.indexOf(c); if(i<0) return null; n=n*58n+BigInt(i); } const out=[]; while(n>0n){ out.unshift(Number(n%256n)); n/=256n; } for(const c of s){ if(c!=='1') break; out.unshift(0); } return new Uint8Array(out); }
  // Bytes de QUALQUER forma que uma wallet/postMessage possa devolver: Uint8Array, ArrayBuffer,
  // Array, objeto indexado {0:..,1:..}, {type:'Buffer',data:[...]} ou {data:[...]}.
  function anyBytes(v){
    if(v instanceof Uint8Array) return v;
    if(v instanceof ArrayBuffer) return new Uint8Array(v);
    if(Array.isArray(v)&&v.every(x=>typeof x==='number')) return new Uint8Array(v);
    if(v&&typeof v==='object'){
      if(Array.isArray(v.data)) return anyBytes(v.data);
      const ks=Object.keys(v).filter(k=>/^\d+$/.test(k));
      if(ks.length>8){ const arr=ks.sort((a,b)=>a-b).map(k=>v[k]); if(arr.every(x=>typeof x==='number')) return new Uint8Array(arr); }
    }
    return null;
  }
  // Tenta extrair 64 bytes de UM valor (sem recursão): bytes diretos, ou string bs58/base64/hex.
  function sig64From(v){
    const direct=anyBytes(v);
    if(direct&&direct.length===64) return direct;
    if(typeof v==='string'){
      const s=v.trim();
      const b58=bs58decode(s); if(b58&&b58.length===64) return b58;             // bs58
      try{ const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0)); if(b.length===64) return b; }catch(e){} // base64
      if(/^(0x)?[0-9a-fA-F]{128}$/.test(s)){ const h=s.replace(/^0x/,''); const b=new Uint8Array(64); for(let i=0;i<64;i++) b[i]=parseInt(h.slice(i*2,i*2+2),16); return b; } // hex
    }
    return null;
  }
  // TODOS os nomes de propriedade de um objeto: próprias (inclusive não-enumeráveis) + do
  // protótipo (getters). Carteiras às vezes expõem a assinatura via getter/propriedade oculta.
  function allKeys(v){
    var out=[]; var seen={};
    try{ var cur=v; for(var d=0; cur && typeof cur==='object' && d<3; d++){ Object.getOwnPropertyNames(cur).forEach(function(k){ if(!seen[k]&&k!=='constructor'){ seen[k]=1; out.push(k); } }); cur=Object.getPrototypeOf(cur); } }catch(e){}
    return out;
  }
  // Descrição PROFUNDA da estrutura (p/ diagnóstico quando nada casar) — inclui ocultas.
  function shapeOf(v,d){ d=d||0; if(v==null) return String(v); if(v instanceof Uint8Array) return 'bytes('+v.length+')'; if(Array.isArray(v)) return 'array('+v.length+'):['+v.slice(0,3).map(function(x){return shapeOf(x,d+1)}).join(',')+']'; if(typeof v==='string') return 'string('+v.length+')'; if(typeof v==='object'){ if(d>2) return 'objeto'; return '{'+allKeys(v).slice(0,8).map(function(k){ var val; try{val=v[k]}catch(e){val='<err>'} return k+':'+shapeOf(val,d+1); }).join(',')+'}'; } if(typeof v==='function') return 'função'; return typeof v; }
  /** Assinatura Solana (ed25519, 64 bytes) → bs58. Busca RECURSIVA pelos 64 bytes em QUALQUER
   *  forma/profundidade que a carteira possa devolver: bytes crus, objeto indexado, array
   *  (wallet-standard devolve [{signature,...}]), string bs58/base64/hex, aninhamentos e até
   *  propriedades não-enumeráveis / do protótipo (getters). */
  function extractSolSig(raw){
    var seen=[];
    function walk(v,depth){
      if(v==null||depth>6) return null;
      var hit=sig64From(v); if(hit) return hit;
      if(typeof v==='object'&&seen.indexOf(v)<0){
        seen.push(v);
        if(Array.isArray(v)){ for(var a=0;a<v.length;a++){ var ra=walk(v[a],depth+1); if(ra) return ra; } }
        // chaves prováveis primeiro, depois TODAS (próprias+ocultas+protótipo); ignora índices.
        var keys=['signature','signedMessage','sig','signatures','data','bytes','value','result','message'];
        allKeys(v).forEach(function(k){ if(keys.indexOf(k)<0&&!/^\d+$/.test(k)) keys.push(k); });
        for(var i=0;i<keys.length;i++){ var val; try{ val=v[keys[i]]; }catch(e){ continue; } if(val!==undefined&&typeof val!=='function'){ var r=walk(val,depth+1); if(r) return r; } }
      }
      return null;
    }
    var bytes=walk(raw,0);
    return bytes?bs58encode(bytes):null;
  }
  function normalizeSolSig(raw){
    var sig=extractSolSig(raw);
    if(sig) return sig;
    throw walletErr('A assinatura não veio no formato esperado. Estrutura recebida: '+shapeOf(raw,0),'BAD_SIG_SHAPE');
  }
  // Promise com timeout — sem isto, uma convenção que a wallet nativa nunca resolve travava a
  // página "carregando infinitamente".
  function withTimeout(p, ms, label){ return Promise.race([ Promise.resolve(p), new Promise(function(_,rej){ setTimeout(function(){ rej(new Error((label||'')+' sem resposta em '+Math.round(ms/1000)+'s')); }, ms); }) ]); }
  /** Assina `message` na Verum Wallet. O provider NATIVO perde a assinatura ao resolver a Promise
   *  (devolve {signature:undefined}); então, em paralelo, ESCUTAMOS o postMessage CRU da carteira
   *  (a resposta chega como evento 'message' na janela) e extraímos os 64 bytes de onde estiverem —
   *  contornando o parsing quebrado do provider. Vence quem primeiro render 64 bytes. Timeout + dump. */
  async function signSolana(prov, message, address){
    var bytes=new TextEncoder().encode(message);
    var attempts=[]; var typesSeen={}; var cleanup=function(){};
    // Captura da resposta BRUTA da carteira (bypass do provider nativo).
    var bridge=new Promise(function(resolve,reject){
      function onMsg(e){
        var d=e&&e.data; if(!d) return;
        if(d.__verum_channel==='cs->page'&&d.msg) d=d.msg;          // modo extensão: desembrulha
        if(typeof d!=='object') return;
        var t=String(d.type||d.method||'msg');
        if(/reject|denied|cancel/i.test(t)){ typesSeen[t]='(rejeitada)'; return; } // rejeição → timeout/erro
        if(!/sign|msg|message|signature/i.test(t)) return;          // ignora connect/balance/etc.
        var sig=extractSolSig(d);
        if(sig){ resolve(sig); return; }
        typesSeen[t]=shapeOf(d,0);                                   // resposta sem 64 bytes → guarda a ESTRUTURA p/ diagnóstico
      }
      window.addEventListener('message',onMsg);
      document.addEventListener('message',onMsg);                   // alguns webviews despacham em document
      cleanup=function(){ window.removeEventListener('message',onMsg); document.removeEventListener('message',onMsg); };
    });
    // Dispara o prompt da carteira (o retorno dele é aproveitado SE vier com assinatura).
    var direct=(async function(){ try{ var r=await prov.signMessage(bytes); if(r!=null){ var s=extractSolSig(r); if(s) return s; attempts.push('retorno direto: '+shapeOf(r,0)); } else attempts.push('retorno direto: vazio'); }catch(e){ attempts.push('retorno direto: '+(e&&e.message||e)); } return new Promise(function(){}); })();
    var timeout=new Promise(function(_,rej){ setTimeout(function(){ rej(walletErr('x','T')); },120000); });
    try{
      var sig=await Promise.race([bridge,direct,timeout]);
      cleanup();
      return sig;
    }catch(e){
      cleanup();
      var seen=Object.keys(typesSeen).map(function(k){ return k+'='+typesSeen[k]; });
      throw walletErr('A Verum Wallet não devolveu a assinatura. '+attempts.join(' ‖ ')+(seen.length?(' · mensagens da carteira: '+seen.join(' ; ')):' · nenhuma mensagem da carteira capturada'),'BAD_SIG_SHAPE');
    }
  }
  /** Endereço Solana da wallet → string base58 (nunca "[object Object]"). */
  function normalizeSolAddress(pk){
    if(typeof pk==='string'&&pk.length>=32) return pk;
    const cand=(pk&&typeof pk.toBase58==='function'&&pk.toBase58())||(pk&&typeof pk.publicKey==='string'&&pk.publicKey)||(pk!=null&&String(pk));
    if(typeof cand==='string'&&cand.length>=32&&cand.indexOf('[object')<0) return cand;
    throw walletErr('A Verum Wallet não devolveu um endereço válido. Reconecte a carteira e tente de novo.','BAD_PK_SHAPE');
  }
  const walletErr = (msg,code) => { const e=new Error(msg); e.code=code; return e; };
  // Provedor Solana — Verum Wallet (preferencial), depois Solflare.
  function solProvider(){
    const w=window;
    // SOMENTE a Verum — nunca Solflare/outras (a mesa aceita só conexões Verum Wallet).
    if(w.verum) return w.verum;
    if(w.solana && w.solana.isVerum) return w.solana;
    return null;
  }
  // Provider EVM da Verum via EIP-6963 (rdns com.verumcrypto.wallet). Sem isto, a
  // MetaMask ocuparia window.ethereum e o pedido iria pra ela. Guarda o provider
  // escolhido em ethProvider p/ assinar a mensagem com a MESMA carteira.
  let ethProvider=null;
  function findVerumEthProvider(){
    return new Promise(resolve=>{
      let picked=null;
      const onAnn=e=>{ const d=e&&e.detail; if(d&&d.provider&&((d.info&&d.info.rdns==='com.verumcrypto.wallet')||d.provider.isVerum)) picked=d.provider; };
      window.addEventListener('eip6963:announceProvider',onAnn);
      try{ window.dispatchEvent(new Event('eip6963:requestProvider')); }catch(e){}
      setTimeout(()=>{
        window.removeEventListener('eip6963:announceProvider',onAnn);
        if(!picked){ const e=window.ethereum; if(e&&e.isVerum) picked=e; else if(e&&Array.isArray(e.providers)) picked=e.providers.find(p=>p&&p.isVerum)||null; }
        resolve(picked||window.ethereum||null);
      },350);
    });
  }
  async function connectWallet(network){
    const w=window;
    if(network==='ethereum'){ const p=await findVerumEthProvider(); if(!p) throw walletErr('Verum Wallet (EVM) não encontrada','NO_WALLET'); ethProvider=p; const accs=await p.request({method:'eth_requestAccounts'}); const address=accs&&accs[0]; if(!address) throw walletErr('Nenhuma conta EVM retornada','NO_WALLET'); return {address,network}; }
    if(network==='solana'){
      const p=solProvider(); if(!p) throw walletErr('Carteira Verum Wallet não encontrada','NO_WALLET');
      const r=await p.connect();
      // Caminho A: a resposta do connect pode EMBUTIR a lista multichain — guardamos p/ o collect.
      window.__verumConnectAddresses=(r&&Array.isArray(r.addresses)&&r.addresses.length)?r.addresses:null;
      const pk=(r&&r.publicKey)?r.publicKey:p.publicKey;
      if(!pk) throw walletErr('Não foi possível ler o endereço da carteira Solana','NO_WALLET');
      return {address:pk.toString(),network};
    }
    if(network==='bitcoin'){ if(!w.unisat) throw walletErr('Carteira Bitcoin (Unisat) não encontrada','NO_WALLET'); const [address]=await w.unisat.requestAccounts(); return {address,network}; }
    throw walletErr('Rede não suportada','NO_WALLET');
  }
  async function signMessage(network,address,message){
    const w=window;
    if(network==='ethereum'){ const p=ethProvider||w.ethereum; if(!p) throw walletErr('Verum Wallet (EVM) não encontrada','NO_WALLET'); return p.request({method:'personal_sign',params:[message,address]}); }
    if(network==='solana'){ const p=solProvider(); if(!p) throw walletErr('Carteira Verum Wallet não encontrada','NO_WALLET'); return signSolana(p,message,address); }
    if(network==='bitcoin') return w.unisat.signMessage(message,'ecdsa');
    throw walletErr('Rede não suportada','NO_WALLET');
  }

  // Saldo via BACKEND (/v1/chains/balances): respeita os CHAIN_ENDPOINT_* do servidor —
  // em testes, lê testnet/devnet; em produção, mainnet. Nada de RPC mainnet fixo no browser.
  async function walletBalance(address,network){
    try{
      const res=await api('/v1/chains/balances',{method:'POST',body:{addresses:[{network,address}]}});
      const it=res&&res.items&&res.items[0];
      if(!it||!it.ok||it.amount==null) return null;
      return Number(it.amount).toLocaleString('pt-BR',{maximumFractionDigits:6})+' '+(it.symbol||'');
    }catch(e){ return null; }
  }

  // Endereços multichain da Verum — fonte 0: a lista EMBUTIDA na resposta do connect (Caminho A,
  // mais confiável); fonte 1: getAddresses() com timeout (o relay separado nem sempre responde).
  async function collectVerumAddresses(){
    const out=new Map();
    const put=a=>{ if(!a) return; const n=String(a.network||'').trim(), ad=String(a.address||'').trim(); if(n.length>=2&&ad.length>=8&&ad.length<=120&&!out.has(n)) out.set(n,ad); };
    try{ (window.__verumConnectAddresses||[]).forEach(put); }catch(e){}
    // Connect já entregou a lista multichain → NÃO dispara getAddresses (evita segundo popup da wallet).
    if(out.size>=2) return [...out.entries()].map(([network,address])=>({network,address}));
    try{
      const p=window.verum;
      if(p&&typeof p.getAddresses==='function'){
        const to=new Promise(res=>setTimeout(()=>res(null),4000));
        const r=await Promise.race([Promise.resolve(p.getAddresses()).catch(()=>null),to]);
        if(r&&Array.isArray(r.addresses)) r.addresses.forEach(put);
      }
    }catch(e){}
    return [...out.entries()].map(([network,address])=>({network,address}));
  }
  function fmtAmt(n){ if(n==null) return '—'; const abs=Math.abs(n); const d=abs>=1?4:abs>=0.0001?6:8; return Number(n).toLocaleString('pt-BR',{maximumFractionDigits:d}); }
  function fmtUsd(n){ if(n==null) return ''; return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

  /* ---------- fluxo ---------- */
  let invite=null; const token=inviteToken();

  function render(){
    const b=$('#body');
    if(!token){ return renderState('err','Link inválido','Este link de convite não contém um código válido.'); }
    if(invite.status==='expired'){ return renderState('err','Convite expirado','Peça ao Pay Master para gerar um novo link.'); }
    if(invite.status==='confirmed'){ return renderState('ok','Carteira já confirmada','Esta carteira já foi conectada à mesa. Nada mais a fazer.'); }
    const r=ROLE[invite.role]||{label:invite.role,cls:'',ico:''};
    const pm=invite.payMaster||{}; const who=pm.org||pm.name||'um Pay Master';
    b.innerHTML=
      '<span class="eyebrow"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>Convite de conexão</span>'+
      '<h1>Conecte sua carteira</h1>'+
      '<p class="sub"><b>'+esc(who)+'</b> convidou você para conectar sua carteira à mesa de operação, no papel abaixo. Você confirma pela sua própria carteira — <b>sem acessar a conta do Pay Master</b>.</p>'+
      '<div class="role-box"><div class="ri '+r.cls+'"><svg viewBox="0 0 24 24">'+r.ico+'</svg></div>'+
        '<div><div class="rl">Seu papel</div><div class="rn">'+r.label+'</div><div class="rnet">Rede: '+(NETLABEL[invite.network]||invite.network)+'</div></div></div>'+
      '<button class="btn btn-primary" id="btnConfirm"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h2M3 10h18"/></svg>Conectar Verum Wallet e confirmar</button>'+
      '<div class="alt">Não tem carteira instalada? <a id="btnDemo">Usar modo demonstração</a></div>'+
      '<div class="note"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg><span>Assinar a mensagem apenas prova que você controla a carteira. Não movimenta fundos nem concede permissões.</span></div>';
    $('#btnConfirm').addEventListener('click',realConfirm);
    $('#btnDemo').addEventListener('click',demoConfirm);
  }

  function renderState(kind,title,msg,extra){
    const ic = kind==='ok'?'<path d="M5 13l4 4L19 7"/>':kind==='err'?'<circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/>':'<circle cx="12" cy="12" r="9"/><path d="M12 8v4l2 2"/>';
    $('#body').innerHTML='<div class="state"><div class="ic '+kind+'"><svg viewBox="0 0 24 24">'+ic+'</svg></div><h1 style="text-align:center">'+esc(title)+'</h1><p class="sub" style="text-align:center;margin-top:8px">'+esc(msg)+'</p>'+(extra||'')+'</div>';
  }
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function busy(on,label){ const btn=$('#btnConfirm'); if(!btn) return; btn.disabled=on; btn.innerHTML=on?'<span class="spin"></span>'+(label||'Aguarde…'):'Conectar Verum Wallet e confirmar'; }

  // Caminho real: conecta carteira injetada, assina o desafio, verifica e confirma.
  async function realConfirm(){
    // A rede escolhida (invite.network) pode ser 'multichain' ou qualquer das 18;
    // a PROVA de posse usa a rede de auth suportada (Verum = Solana por baixo).
    const net=authNetFor(invite.network);
    // Celular sem carteira injetada → abre este convite dentro do navegador da Verum Wallet.
    // Sem wallet injetada (desktop OU mobile) → abre o convite DENTRO do navegador da Verum.
    if(!hasInjectedWallet()){ toast('Abrindo dentro da Verum Wallet…'); openInVerumBrowser(); return; }
    try{
      busy(true,'Conectando carteira…');
      const w=await connectWallet(net);
      busy(true,'Assine o desafio…');
      const ch=await api('/v1/auth/challenge?network='+encodeURIComponent(net)+'&address='+encodeURIComponent(w.address));
      const signature=await signMessage(net,w.address,ch.message);
      const issuedAt=(ch.message.match(/Emitido em: (.+)/)||[])[1];
      const expiresAt=(ch.message.match(/Expira em: (.+)/)||[])[1];
      const ver=await api('/v1/auth/verify',{method:'POST',body:{network:net,address:w.address,nonce:ch.nonce,signature,issuedAt,expiresAt}});
      busy(true,'Confirmando…');
      const addresses=await collectVerumAddresses();
      await api('/v1/portal/mesa/invites/'+encodeURIComponent(token)+'/confirm',{method:'POST',token:ver.token,body:{addresses}});
      success(w.address, addresses);
    }catch(ex){
      if(ex.code==='NO_WALLET'){ toast(ex.message+' — tente o modo demonstração.','err'); busy(false); return; }
      toast(ex.message||'Falha ao confirmar','err'); busy(false);
    }
  }

  // Modo demo (apenas em OTC_ENV=dev no servidor): confirma com endereço simulado, sem assinatura.
  async function demoConfirm(){
    const net=authNetFor(invite.network); const address=net==='ethereum'?hexAddr():('demo'+Math.random().toString(36).slice(2,10));
    try{
      await api('/v1/portal/mesa/invites/'+encodeURIComponent(token)+'/confirm',{method:'POST',body:{address,network:net}});
      success(address);
    }catch(ex){ toast(ex.message||'Modo demo indisponível neste ambiente','err'); }
  }

  function success(address, addresses){
    const multi=Array.isArray(addresses)&&addresses.length>1;
    renderState('ok','Carteira conectada!','Sua carteira foi conectada à mesa como '+((ROLE[invite.role]||{}).label||invite.role)+'. O Pay Master já vê a confirmação em tempo real. Você pode fechar esta página.',
      '<div class="mono" style="text-align:center;margin-top:14px">'+esc(shortAddr(address))+'</div>'+
      (multi?'<div style="text-align:center;margin-top:4px;font-size:12px;color:var(--ink-3)">Carteira multichain · '+addresses.length+' redes</div>':'')+
      '<div id="pf" style="margin-top:14px;font-size:12.5px;color:var(--ink-3)">Lendo saldos…</div>');
    const list=(multi||( Array.isArray(addresses)&&addresses.length))?addresses:[{network:authNetFor(invite.network),address:address}];
    api('/v1/chains/balances',{method:'POST',body:{addresses:list}}).then(res=>{
      const el=$('#pf'); if(!el) return; const items=(res&&res.items)||[];
      if(!items.length){ el.textContent='Nenhuma rede com saldo.'; return; }
      const row=(l,r,ind)=>'<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);'+(ind?'padding-left:14px':'')+'"><span style="color:'+(ind?'var(--ink-3)':'var(--ink-2)')+'">'+l+'</span><span class="mono" style="color:var(--ink)">'+r+'</span></div>';
      const val=it=>{ const v=it.valueUsd!=null?' · '+fmtUsd(it.valueUsd):''; return esc(fmtAmt(it.amount)+' '+it.symbol+v); };
      const rows=items.map(it=>{
        let right; if(it.supported===false) right='não suportada'; else if(!it.ok) right='indisponível'; else right=val(it);
        let html=row('<b>'+esc(it.displayName||it.network)+'</b>',right,false);
        (it.tokens||[]).filter(t=>t&&t.amount>0).forEach(t=>{ html+=row(esc(t.symbol),val(t),true); });
        return html;
      }).join('');
      const total=(res&&res.totalUsd)?'<div style="margin-top:8px;text-align:right;color:var(--ink);font-weight:600">Total ≈ '+fmtUsd(res.totalUsd)+'</div>':'';
      el.innerHTML=rows+total;
    }).catch(()=>{ const el=$('#pf'); if(el) el.textContent='Não foi possível ler os saldos agora.'; });
  }

  /* ================= CONVITE v3 (mesa multi-instância): /otc/convite/<inviteId>?c=<código> ================= */
  const V3=(function(){ const m=location.pathname.match(/\/otc\/convite\/([^/?#]+)/); if(!m) return null; return { inviteId:decodeURIComponent(m[1]), code:(new URLSearchParams(location.search)).get('c')||'' }; })();
  let v3Info=null;
  // Verum-only: aceita SOMENTE o provider oficial da Verum Wallet (window.verum, injetado pelo
  // dapp-browser/extensão). User-agent nunca é prova. Sem Verum → tela de bloqueio.
  function verumProvider(){ const w=window; if(w.verum) return w.verum; if(w.solana&&w.solana.isVerum) return w.solana; return null; }
  function v3Countdown(exp){ let off=0; return ()=> { const ms=Math.max(0,exp-(Date.now()+off)); const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000); return (h?(('0'+h).slice(-2)+':'):'')+('0'+m).slice(-2)+':'+('0'+s).slice(-2); }; }
  function v3Blocked(){
    renderState('err','Abra na Verum Wallet','Este convite deve ser aberto na Verum Wallet. Esta mesa aceita somente conexões pela Verum Wallet.',
      '<button class="btn btn-primary" id="v3Open" style="margin-top:16px">Abrir na Verum Wallet</button>'
      +'<a class="btn" href="https://www.verumcrypto.com/wallet" target="_blank" rel="noopener" style="margin-top:10px;text-decoration:none">Baixar Verum Wallet</a>');
    const b=$('#v3Open'); if(b) b.addEventListener('click',openInVerumBrowser);
  }
  function v3Render(){
    const i=v3Info;
    if(i.status==='EXPIRED'){ return renderState('err','Convite expirado','Peça ao Pay Master um novo convite.'); }
    if(i.status==='REVOKED'){ return renderState('err','Convite revogado','Peça ao Pay Master um novo convite.'); }
    if(i.status==='USED'){ return renderState('err','Convite já utilizado','Este convite já foi usado. Se foi você, abra a mesa pelo link que recebeu após conectar.'); }
    const tick=v3Countdown(i.expiresAt);
    const r=ROLE[i.role]||{label:i.roleLabel||i.role,cls:'',ico:''};
    const needCode=!i.codeValid;
    $('#body').innerHTML=
      '<span class="eyebrow"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>Convite para mesa</span>'
      +'<h1>VERUM OTC · Convite para mesa</h1>'
      +'<p class="sub">Mesa <b>'+esc(i.mesaCode)+'</b> · Função <b>'+esc(i.roleLabel)+'</b> · Ativo <b>'+esc(i.asset)+'</b> ('+esc(i.networkLabel)+') · Expira em <span class="mono" id="v3Cd">'+tick()+'</span></p>'
      +'<div class="role-box"><div class="ri '+r.cls+'"><svg viewBox="0 0 24 24">'+r.ico+'</svg></div><div><div class="rl">Sua função</div><div class="rn">'+esc(i.roleLabel)+'</div><div class="rnet">Rede: '+esc(i.networkLabel)+'</div></div></div>'
      +(needCode?'<div style="margin-bottom:14px"><div style="font-size:12px;color:var(--ink-3);margin-bottom:6px">Código do convite</div><input id="v3Code" maxlength="9" placeholder="XXXX-XXXX" style="width:100%;height:48px;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;color:var(--ink);font-family:var(--f-mono);font-size:18px;letter-spacing:.14em;text-align:center;text-transform:uppercase"></div>':'')
      +'<div style="margin-bottom:14px"><div style="font-size:12px;color:var(--ink-3);margin-bottom:6px">Seu primeiro nome</div><input id="v3Name" maxlength="30" placeholder="Como quer ser identificado na mesa" style="width:100%;height:48px;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;color:var(--ink);font-size:15px;padding:0 14px"></div>'
      +'<button class="btn btn-primary" id="v3Connect"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h2M3 10h18"/></svg>Conectar Verum Wallet</button>'
      +'<div class="note"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg><span>Esta mesa aceita conexão somente pela Verum Wallet. Assinar a autorização apenas prova que você controla a carteira — não movimenta fundos.</span></div>'
      +'<div style="text-align:center;font-size:10.5px;color:var(--ink-3);margin-top:10px;font-family:var(--f-mono)">'+esc(BUILD)+'</div>';
    const cd=$('#v3Cd'); if(cd) setInterval(()=>{ cd.textContent=tick(); },1000);
    $('#v3Connect').addEventListener('click',v3Connect);
  }
  function v3Busy(on,label){ const b=$('#v3Connect'); if(!b) return; b.disabled=on; b.innerHTML=on?'<span class="spin"></span>'+(label||'Aguarde…'):'Conectar Verum Wallet'; }
  async function v3Connect(){
    const code=($('#v3Code')?$('#v3Code').value.trim():'')||V3.code;
    if(!code){ toast('Digite o código do convite','err'); return; }
    const name=($('#v3Name')&&$('#v3Name').value.trim())||'';
    if(name.length<2||name.length>30){ toast('Informe seu primeiro nome (2 a 30 caracteres)','err'); return; }
    // Celular sem provider injetado → abre ESTE convite dentro do navegador da Verum (síncrono no clique).
    if(!verumProvider()){ toast('Abrindo na Verum Wallet…'); openInVerumBrowser(); return; }
    try{
      v3Busy(true,'Conectando Verum Wallet…');
      const prov=verumProvider();
      const r=await prov.connect();
      const pk=(r&&r.publicKey)?r.publicKey:prov.publicKey;
      if(!pk) throw new Error('Não foi possível ler o endereço da Verum Wallet');
      const address=normalizeSolAddress(pk);
      v3Busy(true,'Gerando autorização…');
      const ch=await api('/v1/mesa-invites/'+encodeURIComponent(V3.inviteId)+'/challenge',{method:'POST',body:{code,firstName:name,network:'solana',address}});
      // O usuário DESLIZA para assinar na Verum Wallet — é a prova de posse. A assinatura é
      // capturada do canal cru da carteira (signSolana), pois o provider nativo não a entrega no
      // retorno da Promise. slice(0,30): o backend rejeita a lista inteira acima de 50 itens.
      v3Busy(true,'Deslize para assinar na Verum Wallet…');
      const signature=await signSolana(prov,ch.message,address);
      v3Busy(true,'Confirmando posse…');
      const addresses=(await collectVerumAddresses()).slice(0,30);
      const join=await api('/v1/mesa-invites/'+encodeURIComponent(V3.inviteId)+'/join',{method:'POST',body:{code,firstName:name,network:'solana',address,nonce:ch.nonce,signature,addresses}});
      // Redireciona DIRETO para a operação (visão do participante, somente leitura). Guarda o token
      // também em sessionStorage p/ a mesa recuperá-lo mesmo se o fragmento #pt se perder.
      const dest='/mesa?mesa='+encodeURIComponent(join.mesaId)+'#pt='+encodeURIComponent(join.token);
      try{ sessionStorage.setItem('verum_mesa_pt_'+join.mesaId, join.token); }catch(e){}
      renderState('ok','Conectado! Abrindo a operação…','');
      window.location.replace(dest);
    }catch(ex){
      v3Busy(false);
      // Erro de formato de assinatura: mostra o detalhe COMPLETO + botão copiar (toast trunca e o
      // dump da estrutura da wallet é o que fecha o diagnóstico).
      if(ex&&ex.code==='BAD_SIG_SHAPE'){
        const det=String(ex.message||'');
        renderState('err','Não foi possível ler a assinatura',det,
          '<button class="btn" id="v3Copy" style="margin-top:14px">Copiar erro</button>'
          +'<button class="btn btn-primary" id="v3Retry" style="margin-top:10px">Tentar de novo</button>');
        const c=$('#v3Copy'); if(c) c.addEventListener('click',()=>{ try{ navigator.clipboard.writeText(det); toast('Erro copiado','ok'); }catch(e){} });
        const rt=$('#v3Retry'); if(rt) rt.addEventListener('click',()=>{ v3Render(); });
        return;
      }
      toast(ex.message||'Falha na conexão','err');
    }
  }

  (async function init(){
    if(V3){
      try{ v3Info=await api('/v1/mesa-invites/'+encodeURIComponent(V3.inviteId)+(V3.code?('?c='+encodeURIComponent(V3.code)):'')); }
      catch(ex){ renderState('err','Convite inválido ou expirado',ex.message||'Este convite não existe ou expirou.'); return; }
      // Fora da Verum Wallet (navegador comum/extensões de terceiros): bloqueio com instruções.
      // No mobile a navegação ao dapp-browser acontece no CLIQUE (síncrona) — mostramos o form.
      if(!verumProvider() && !IS_MOBILE){ v3Blocked(); return; }
      v3Render();
      return;
    }
    if(!token){ render(); return; }
    try{ invite=await api('/v1/portal/mesa/invites/'+encodeURIComponent(token)); render(); }
    catch(ex){ renderState('err','Convite não encontrado',ex.message||'Este convite não existe ou expirou.'); }
  })();
})();
</script>
</body>
