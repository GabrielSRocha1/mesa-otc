<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="verum-otc-api" content="">
<title>VERUM OTC — Visualizar operação</title>
<style>
  :root{ --bg:#070b14; --bg-2:#0d1320; --panel:#0f1626; --line:#1e2a3f; --ink:#eaf0fb; --ink-2:#b9c6dd; --ink-3:#7f8fa6; --blue:#3b82f6; --ok:#22c55e; --wait:#f59e0b; --err:#ef4444; --f:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,monospace; }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--f);min-height:100vh;padding:20px 14px}
  .wrap{max-width:560px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:12.5px;margin-bottom:14px;letter-spacing:.04em}
  .brand b{color:var(--ink)}
  .ro{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin-left:auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .t{font-weight:700;font-size:16px}
  .pair{font-size:22px;font-weight:700;letter-spacing:.01em}
  .sub{color:var(--ink-3);font-size:12.5px;margin-top:2px}
  .mono{font-family:var(--mono)}
  .badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 10px;border:1px solid var(--line)}
  .badge.ok{background:rgba(34,197,94,.12);color:#86efac;border-color:rgba(34,197,94,.4)}
  .badge.wait{background:rgba(245,158,11,.12);color:#fcd34d;border-color:rgba(245,158,11,.4)}
  .badge.info{background:rgba(59,130,246,.12);color:#93c5fd;border-color:rgba(59,130,246,.4)}
  .badge.err{background:rgba(239,68,68,.12);color:#fca5a5;border-color:rgba(239,68,68,.4)}
  .prog{height:8px;background:var(--bg-2);border-radius:999px;overflow:hidden;margin:10px 0 4px}
  .prog>span{display:block;height:100%;background:var(--blue);width:0}
  .part{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .part:last-child{border-bottom:0}
  .part .nm{font-weight:600;font-size:13.5px}
  .part .ad{font-size:12px;color:var(--ink-3)}
  .part .st{margin-left:auto}
  .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--ink-3)}
  .foot{color:var(--ink-3);font-size:11.5px;text-align:center;margin-top:6px}
  .state{display:grid;place-items:center;min-height:50vh;text-align:center;color:var(--ink-3);padding:20px}
  .spin{width:26px;height:26px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><b>VERUM OTC</b> · Operação <span class="ro"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>Somente leitura</span></div>
    <div id="body"><div class="state"><div><div class="spin"></div>Carregando operação…</div></div></div>
  </div>
<script>
(function(){
  var META=document.querySelector('meta[name="verum-otc-api"]');
  var API=((META&&META.content)||'/').replace(/\/$/,'');
  var m=location.pathname.match(/\/op\/([^/?#]+)/);
  var q=new URLSearchParams(location.search);
  var ID=(m&&decodeURIComponent(m[1]))||q.get('id')||q.get('op')||'';
  var ROLE={SELLER:'Vendedor',BUYER:'Comprador',PAYMASTER_1:'Pay Master 1',PAYMASTER_2:'Pay Master 2'};
  var STATE={AWAITING_SIGNATURES:['wait','Aguardando assinaturas'],FULLY_SIGNED:['info','Assinada'],SETTLEMENT_VALIDATION:['info','Validando liquidação'],SETTLING:['info','Liquidando'],SETTLED:['ok','Liquidada'],EXPIRED:['err','Expirada'],CANCELLED:['err','Cancelada'],BLOCKED:['err','Bloqueada'],REFUNDING:['err','Reembolsando'],REFUNDED:['err','Reembolsada'],DRAFT:['info','Rascunho'],CREATED:['info','Criada'],WALLETS_CONNECTED:['info','Carteiras conectadas'],ASSETS_VERIFIED:['info','Ativos verificados'],LIQUIDITY_VERIFIED:['info','Liquidez verificada']};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function badge(st){var e=STATE[st]||['info',st];return '<span class="badge '+e[0]+'">'+esc(e[1])+'</span>';}
  function fmtDate(ms){try{return new Date(ms).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return '—';}}
  function stateMsg(kind,title,msg){document.getElementById('body').innerHTML='<div class="state"><div><div style="font-size:17px;color:var(--ink);font-weight:700;margin-bottom:6px">'+esc(title)+'</div>'+esc(msg||'')+'</div></div>';}
  function render(o){
    var parts=(o.participants||[]).map(function(p){
      var st=p.signed?'<span class="badge ok">✓ Assinou</span>':(p.isTurn&&o.state==='AWAITING_SIGNATURES'?'<span class="badge wait">Vez de assinar</span>':'<span class="badge info">Aguardando</span>');
      return '<div class="part"><div><div class="nm">'+esc(ROLE[p.role]||p.role)+'</div><div class="ad mono">'+esc(p.address||'')+(p.network?(' · '+esc(p.network)):'')+'</div></div><div class="st">'+st+'</div></div>';
    }).join('');
    var pct=o.requiredSignatures?Math.round((o.validSignatures||0)/o.requiredSignatures*100):0;
    var turn=(o.state==='AWAITING_SIGNATURES'&&o.turnRole)?('<div class="sub">Vez atual: <b style="color:var(--ink-2)">'+esc(ROLE[o.turnRole]||o.turnRole)+'</b></div>'):'';
    document.getElementById('body').innerHTML=
      '<div class="card"><div class="ch"><div><div class="pair">'+esc(o.assetIn||'—')+' <span style="color:var(--ink-3)">→</span> '+esc(o.assetOut||'—')+'</div><div class="sub mono">'+esc(o.id)+'</div></div>'+badge(o.state)+'</div>'
      +'<div class="prog"><span style="width:'+pct+'%"></span></div>'
      +'<div class="sub">'+(o.validSignatures||0)+' de '+(o.requiredSignatures||0)+' assinaturas · '+pct+'%</div>'+turn+'</div>'
      +'<div class="card"><div class="t" style="font-size:13.5px;margin-bottom:6px">Participantes</div>'+(parts||'<div class="sub">—</div>')+'</div>'
      +'<div class="card"><div class="row"><span class="k">Criada em</span><span class="v">'+fmtDate(o.createdAt)+'</span></div>'
      +'<div class="row"><span class="k">Expira em</span><span class="v">'+fmtDate(o.expiresAt)+'</span></div>'
      +(o.amountInBase?'<div class="row"><span class="k">Quantidade (unid. base)</span><span class="v mono">'+esc(o.amountInBase)+'</span></div>':'')
      +'</div>'
      +'<div class="foot">Esta página é somente leitura — acompanha a operação em tempo real. Assinar/movimentar fundos acontece pela mesa, na Verum Wallet.</div>';
  }
  function load(){
    if(!ID){ stateMsg('err','Link inválido','Não foi possível identificar a operação.'); return; }
    fetch(API+'/v1/operations/'+encodeURIComponent(ID)+'/view',{headers:{accept:'application/json'}})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
      .then(function(res){ if(!res.ok){ stateMsg('err','Operação não encontrada',(res.d&&(res.d.message||res.d.error))||'Confira o link.'); return; } render(res.d); })
      .catch(function(){ /* mantém o último render durante falhas de rede */ });
  }
  load(); setInterval(load,5000);
})();
</script>
</body>
</html>
